<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearts News 24</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050407;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: pointer;
        outline: none;
        display: block;
      }
      #screen {
        position: relative;
        display: inline-block;
        line-height: 0;
      }
      /* Optional retro TV look (T key): scanlines, a soft vignette, and a little extra punch. */
      #screen.crt canvas {
        filter: contrast(1.06) saturate(1.12) brightness(1.04);
      }
      #screen.crt::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.45) 100%);
        border-radius: 12px;
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="screen"><canvas id="tv" tabindex="0" aria-label="Hearts News 24 broadcast"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
