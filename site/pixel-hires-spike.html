<style>
  html, body { margin: 0; height: 100%; background: #0e0c10; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; aspect-ratio: 16 / 9; width: min(100vw, 100vh * 16 / 9); overflow: hidden; font-family: 'Press Start 2P', 'Courier New', monospace; font-size: calc(min(100vw, 100vh * 16 / 9) / 100); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

  #tick { display: grid; grid-template-columns: auto auto 1fr; background: #120f22; color: #f2efe6; font-size: .85em; border-top: .35em solid #e0b13a; }
  #tick .logo { background: #e0b13a; color: #3d0d17; padding: 0 1em; display: grid; place-items: center; }
  #tick .clock { background: #3d0d17; color: #f2efe6; padding: 0 1em; display: grid; place-items: center; }
  #tick .win { overflow: hidden; position: relative; }
  #track { position: absolute; left: 0; top: 0; bottom: 0; display: flex; align-items: center; white-space: nowrap; will-change: transform; }
  #track span { padding-right: 3em; } #track b { color: #e0b13a; font-weight: normal; margin-right: .8em; }
  #cap { position: absolute; left: 4em; right: 4em; bottom: 23em; background: #120f22; color: #f2efe6; padding: .6em 1.2em; font-size: .95em; line-height: 1.6; }
  #cap b { color: #e0b13a; font-weight: normal; margin-right: .8em; }
  #hint { position: fixed; right: 12px; top: 10px; color: #f2efe6aa; font: 12px sans-serif; }
</style>

<body>
<div id="stage"><div id="frame">
  <canvas id="cv"></canvas>
  <div id="cap" class="px"><b id="who"></b><span id="line"></span></div>
  <div id="stack">
    <div id="top">
      <div id="brand"><div class="mark">H24</div><div class="name">HEARTS<i>NEWS 24</i></div></div>
      <div id="head"><div id="headin">VRANCKEN HAS HEARTS HIGH-PRESSURE PROOFED FOR RANGERS</div></div>
    </div>
    <div id="tick">
      <div class="logo">H24</div><div class="clock" id="clock">00:00</div>
      <div class="win"><div id="track"></div></div>
    </div>
  </div>
</div></div>
<div id="hint">480×270 art grid, shown 3× at 1440×810 · 13s loop · bottom stack + ticker</div>

<script type="module">
// ===== Hi-res pixel art, built from layered sprites ==========================
// Each presenter is baked once into small layers (body, head, eye / brow / mouth frames, hand frames)
// using per-pixel lighting quantised to hand-tuned colour ramps with a light dither at band edges.
// At runtime we just composite the layers at integer offsets: no re-drawing, so animation is cheap and crisp.
const GW = 480, GH = 270;

// ---------- colour + pixel helpers -----------------------------------------
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
/** Hue-shifted ramp: shadows drift cool/purple, highlights drift warm. */
function ramp(base, n = 6, cool = [0.42, 0.32, 0.62], warm = [255, 238, 200]) {
  const b = hex(base), sh = [b[0] * cool[0], b[1] * cool[1], b[2] * cool[2]];
  return Array.from({ length: n }, (_, i) => { const t = i / (n - 1) * 2 - 1; return t < 0 ? mix(b, sh, -t * 0.85) : mix(b, warm, t * 0.5); });
}
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]].map(r => r.map(v => (v + 0.5) / 16));
function pick(lum, rp, x, y) {
  const v = clamp(lum) * (rp.length - 1), base = Math.floor(v), f = smooth(0.3, 0.7, v - base);
  const i = Math.min(rp.length - 1, base + (f > BAYER[y & 3][x & 3] ? 1 : 0));
  return rp[i];
}
const LIGHT = (() => { const l = [-0.55, -0.65, 0.55], m = Math.hypot(...l); return l.map(v => v / m); })();
function lambert(nx, ny, nz, rim = 0.25) {
  const m = Math.hypot(nx, ny, nz) || 1; nx /= m; ny /= m; nz /= m;
  let l = (nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) * 0.8 + 0.4;
  if (nx > 0) l += Math.pow(1 - nz, 2) * rim;
  return clamp(l);
}

class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Uint8ClampedArray(w * h * 4); }
  idx(x, y) { return (y * this.w + x) * 4; }
  has(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h && this.d[this.idx(x, y) + 3] > 0; }
  set(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; const i = this.idx(x, y); this.d[i] = c[0]; this.d[i + 1] = c[1]; this.d[i + 2] = c[2]; this.d[i + 3] = 255; }
  get(x, y) { const i = this.idx(x, y); return [this.d[i], this.d[i + 1], this.d[i + 2]]; }
  paint(x0, y0, x1, y1, fn) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const c = fn(x, y); if (c) this.set(x, y, c); } }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); }
  outline(col) {
    const out = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (!this.has(x, y) && (this.has(x - 1, y) || this.has(x + 1, y) || this.has(x, y - 1) || this.has(x, y + 1))) out.push([x, y]);
    for (const [x, y] of out) this.set(x, y, col);
  }
  canvas() { const c = document.createElement('canvas'); c.width = this.w; c.height = this.h; c.getContext('2d').putImageData(new ImageData(this.d, this.w, this.h), 0, 0); return c; }
}

// ---------- head -------------------------------------------------------------
// Head layer is 100×112, centre (50, 48). Features are separate layers placed relative to this.
const HW = 100, HH = 112, HCX = 50, HCY = 48, RX = 17, RY = 21;
const FACE = { eyeY: -1, eyeX: 8, browY: -7, noseY: 9, mouthY: 15 };

function headShape(x, y) {
  const u = (x - HCX) / RX, v = (y - HCY) / RY;
  const taper = 1 - 0.3 * smooth(0.1, 1, v);
  const ue = u / taper;
  const d = ue * ue + v * v;
  return d <= 1 ? { ue, v, z: Math.sqrt(1 - d), u } : null;
}

function buildHead(o) {
  const P = new Pix(HW, HH);
  const skin = ramp(o.skin, 6), hair = ramp(o.hair, 6, [0.4, 0.3, 0.55], [255, 230, 180]);
  const skinOut = mix(hex(o.skin), [40, 18, 30], 0.78), hairOut = mix(hex(o.hair), [20, 10, 14], 0.8);
  const isHair = new Set();
  // Hair back (behind the head) for long styles.
  if (o.style === 'bob') {
    P.paint(HCX - 30, HCY - RY - 6, HCX + 30, HCY + 22, (x, y) => {
      const u = (x - HCX) / (RX + 7), v = (y - HCY) / (RY + 4);
      let inside = y < HCY ? u * u + v * v <= 1 : Math.abs(u) <= 1 - Math.pow(Math.max(0, y - (HCY + 12)) / 12, 2) * 0.6;
      if (!inside) return null;
      const l = lambert(u * 0.9, -0.1, Math.sqrt(Math.max(0.05, 1 - u * u))) * 0.75 + 0.04 * Math.sin(x * 1.2 + y * 0.15);
      return pick(l, hair, x, y);
    });
  }
  // Ears (behind face so the shaded head overlaps them).
  for (const s of [-1, 1]) {
    P.paint(HCX + s * (RX) - 3, HCY - 2, HCX + s * RX + 3, HCY + 10, (x, y) => {
      const u = (x - (HCX + s * (RX + 0.5))) / 3, v = (y - (HCY + 4)) / 5;
      if (u * u + v * v > 1) return null;
      return pick(lambert(s * 0.6, 0, 0.8) - 0.12, skin, x, y);
    });
    P.set(HCX + s * (RX + 0.5), HCY + 3, skin[1]); P.set(HCX + s * (RX + 0.5), HCY + 4, skin[1]);
  }
  // Face.
  const faceMap = new Set();
  P.paint(HCX - RX - 1, HCY - RY - 1, HCX + RX + 1, HCY + RY + 1, (x, y) => {
    const h = headShape(x, y); if (!h) return null;
    faceMap.add(x + ',' + y);
    let l = lambert(h.ue * 0.85, h.v * 0.85, h.z);
    // Soft occlusion under the chin line and slight cheekbone lift.
    l += 0.06 * smooth(0.0, 0.5, -Math.abs(h.u + 0.55)) * (h.v > -0.1 && h.v < 0.5 ? 1 : 0);
    if (o.dome) l += 0.34 * Math.exp(-Math.pow((h.v + 0.62) / 0.14, 2)) * (Math.abs(h.u) < 0.55 ? 1 : 0); // shiny bald dome
    return pick(l, skin, x, y);
  });
  // Cheek blush (dithered).
  if (o.blush) {
    const bl = mix(skin[3], [226, 110, 124], 0.4);
    for (const s of [-1, 1]) P.paint(HCX + s * 10 - 5, HCY + 4, HCX + s * 10 + 5, HCY + 12, (x, y) => {
      const u = (x - (HCX + s * 10)) / 5, v = (y - (HCY + 8)) / 3.6;
      return u * u + v * v < 1 && (1 - u * u - v * v) * 0.9 > BAYER[y & 3][x & 3] && faceMap.has(x + ',' + y) ? bl : null;
    });
  }
  // Nose: right-side shadow, tip highlight, nostrils, shadow beneath.
  for (let y = HCY - 3; y <= HCY + 7; y++) P.set(HCX + 2 + (y > HCY + 4 ? 1 : 0), y, skin[1]);
  P.paint(HCX - 4, HCY + 5, HCX + 4, HCY + 12, (x, y) => { const u = (x - HCX) / 3.6, v = (y - (HCY + 9)) / 2.6; return u * u + v * v < 1 ? skin[4] : null; });
  P.set(HCX - 1, HCY + 8, skin[5]); P.set(HCX - 2, HCY + 8, skin[5]);
  P.set(HCX - 2, HCY + 11, skin[0]); P.set(HCX + 2, HCY + 11, skin[0]);
  for (let x = -3; x <= 3; x++) P.set(HCX + x, HCY + 12, skin[1]);
  // Fraser extras: wrinkles + smile lines.
  if (o.wrinkles) {
    for (const yy of [HCY - 14, HCY - 11]) for (let x = HCX - 9; x <= HCX + 9; x++) if (Math.abs(x - HCX) > 1 && (x + yy) % 5 !== 0) P.set(x, yy, skin[2]);
    for (const s of [-1, 1]) {
      for (let i = 0; i < 6; i++) P.set(HCX + s * (5 + i * 0.7), HCY + 8 + i * 1.5, skin[2]);   // nasolabial
      P.set(HCX + s * 14, HCY - 1, skin[2]); P.set(HCX + s * 15, HCY + 1, skin[2]); P.set(HCX + s * 14, HCY + 3, skin[2]); // crow's feet
    }
  }
  // Hair front.
  if (o.style === 'bob') {
    const fringeY = x => HCY - RY + 9 - 5 * ((x - HCX) / RX);
    P.paint(HCX - RX - 6, HCY - RY - 5, HCX + RX + 6, HCY + 30, (x, y) => {
      const e2 = Math.pow((x - HCX) / (RX + 4), 2) + Math.pow((y - (HCY - 3)) / (RY + 4), 2) <= 1;
      const side = Math.abs(x - HCX) >= RX - 3 && Math.abs(x - HCX) <= RX + 5 && y >= HCY - 8 && y <= HCY + 26 - Math.max(0, Math.abs(x - HCX) - (RX + 2)) * 3;
      const top = e2 && (y < fringeY(x));
      if (!(top || side)) return null;
      const u = (x - HCX) / (RX + 5), v = (y - HCY) / (RY + 5);
      const strand = 0.09 * Math.sin((x - HCX) * 1.35 + Math.sin(y * 0.35) * 2.2);
      let l = lambert(u, v * 0.7, Math.sqrt(Math.max(0.05, 1 - u * u - v * v * 0.4))) + strand;
      l += 0.3 * Math.exp(-Math.pow((v + 0.55) / 0.12, 2)) * (Math.abs(u) < 0.8 ? 1 : 0);
      isHair.add(x + ',' + y);
      return pick(l, hair, x, y);
    });
  } else { // grey side hair, bald dome
    for (const s of [-1, 1]) P.paint(HCX + s * RX - 4, HCY - 7, HCX + s * RX + 5, HCY + 9, (x, y) => {
      const dx = (x - (HCX + s * (RX + 0.5))) / 4.5, dy = (y - (HCY + 1)) / 8;
      if (dx * dx + dy * dy > 1 || Math.abs(x - HCX) < RX - 2 - (y - HCY) * 0.1) return null;
      isHair.add(x + ',' + y);
      return pick(lambert(s * dx, dy, 0.6) + 0.07 * Math.sin(y * 1.9 + x), hair, x, y);
    });
  }
  // Shadow cast by hair onto skin beneath it.
  for (const k of faceMap) { const [x, y] = k.split(',').map(Number); if (isHair.has(x + ',' + y)) continue; if (isHair.has(x + ',' + (y - 1)) || isHair.has(x + ',' + (y - 2))) P.set(x, y, skin[1]); }
  P.outline(isHair.size && o.style === 'bob' ? hairOut : skinOut);
  return P.canvas();
}

// ---------- features -------------------------------------------------------------
function buildEyes(o, kind, gaze) { // kind: open | blink
  const P = new Pix(40, 14); const cx = 20, cy = 7;
  const skin = ramp(o.skin, 6), dark = [24, 14, 22], lash = o.lash || dark;
  for (const s of [-1, 1]) {
    const ex = cx + s * FACE.eyeX, ey = cy;
    if (kind === 'open') {
      P.paint(ex - 6, ey - 4, ex + 6, ey + 4, (x, y) => {
        const u = (x - ex) / 4.8, v = (y - ey) / 2.8; if (u * u + v * v > 1) return null;
        return v < -0.4 ? [206, 196, 208] : [250, 246, 244];
      });
      const ix = ex + gaze * 1.2, iy = ey + 0.2;
      P.paint(ex - 6, ey - 4, ex + 6, ey + 4, (x, y) => {
        const u = (x - ex) / 4.8, v = (y - ey) / 2.8; if (u * u + v * v > 1) return null;
        const r = Math.hypot(x - ix, (y - iy) * 0.95); if (r > 2.5) return null;
        if (r < 1.1) return [10, 8, 14];
        return (y > iy ? o.iris[1] : o.iris[0]);
      });
      P.set(ix - 1, iy - 1, [255, 255, 255]);
      for (let x = -5; x <= 5; x++) { const yy = ey - 2.9 * Math.sqrt(Math.max(0, 1 - (x / 5.2) ** 2)) - 0.6; P.set(ex + x, yy, lash); if (x * s > 0) P.set(ex + x, yy - 1, lash); }
      P.set(ex + s * 6, ey - 2, lash); if (o.lashes) { P.set(ex + s * 7, ey - 3, lash); P.set(ex + s * 6, ey - 3, lash); }
      for (let x = -3; x <= 3; x++) P.set(ex + x, ey - 5.2 + Math.abs(x) * 0.25, skin[2]);              // lid crease
      for (let x = -3; x <= 3; x++) P.set(ex + x, ey + 3.4, skin[2]);                                     // lower lid
    } else {
      for (let x = -5; x <= 5; x++) P.set(ex + x, ey + 1.0 * Math.sqrt(Math.max(0, 1 - (x / 5.4) ** 2)) - 0.3, lash);
      if (o.lashes) { P.set(ex + s * 6, ey + 1, lash); P.set(ex + s * 7, ey + 2, lash); }
    }
  }
  return P.canvas();
}
function buildBrows(o, raise) {
  const P = new Pix(40, 12); const cx = 20, cy = 6 - raise;
  const c = ramp(o.hair, 6)[1];
  for (const s of [-1, 1]) for (let x = -5; x <= 5; x++) {
    const t = x / 5.5, arch = -(1 - t * t) * (o.browArch || 1.5) + (s * x > 2 ? 1.2 * (s * x - 2) / 3 : 0);
    const ey = Math.round(cy + arch - (s * x < 0 ? 0 : 0));
    for (let k = 0; k < (o.browThick || 1); k++) P.set(cx + s * FACE.eyeX + x, ey + k, c);
  }
  return P.canvas();
}
function buildMouth(o, { hw = 6, open = 0, teeth = false, tongue = false, smile = 0 }) {
  const P = new Pix(28, 16); const cx = 14, cy = 8;
  const lip = ramp(o.lip, 6), inside = [58, 15, 24];
  for (let x = -hw; x <= hw; x++) {
    const t = x / hw, yc = cy - smile * t * t * 1.6, up = open * (1 - t * t);
    const yT = Math.round(yc - up), yB = Math.round(yc + up);
    for (let y = yT; y <= yB; y++) P.set(cx + x, y, tongue && y >= yB - 1 && open > 2 ? [196, 84, 98] : teeth && y <= yT + 1 && open >= 1.2 ? [246, 240, 232] : inside);
    P.set(cx + x, yT - 1, lip[1]); if (Math.abs(x) <= 1) P.set(cx + x, yT - 2, lip[2]);
    P.set(cx + x, yB + 1, lip[3]); if (Math.abs(x) < hw - 2) P.set(cx + x, yB + 2, lip[4]);
    if (Math.abs(x) <= 2 && Math.abs(x) < hw - 1) P.set(cx + x, yB + 2, lip[5]);
    if (open === 0) P.set(cx + x, yT, lip[0]);
  }
  P.set(cx - hw - 1, Math.round(cy - smile * 1.6), lip[0]); P.set(cx + hw + 1, Math.round(cy - smile * 1.6), lip[0]);
  return P.canvas();
}

// ---------- body -------------------------------------------------------------
// Body layer 130×120: neck top at y=0, shoulders widen to ±SW; desk hides everything below y≈ (190 − bodyTop).
const BW = 130, BH = 120, BCX = 65;
function buildBody(o) {
  const P = new Pix(BW, BH);
  const suit = ramp(o.suit, 6, [0.45, 0.4, 0.7]).map((c, i) => i >= 3 ? mix(c, hex(o.suit), 0.55) : c), skin = ramp(o.skin, 6), shirt = ramp('#f2efe6', 6, [0.6, 0.6, 0.85], [255, 255, 245]);
  const SW = o.shoulder, dark = mix(hex(o.suit), [10, 8, 20], 0.7);
  // Neck with a soft chin shadow.
  P.paint(BCX - 8, 0, BCX + 8, 24, (x, y) => { const u = (x - BCX) / 8; const l = lambert(u * 0.8, 0, Math.sqrt(1 - u * u)) - 0.28 * (1 - smooth(0, 9, y)); return pick(l, skin, x, y); });
  // Torso (sloped shoulders) + sleeves.
  const W = y => { const t = clamp((y - 12) / 20); return 9 + (SW - 9) * (1 - (1 - t) * (1 - t)); };
  P.paint(0, 12, BW - 1, BH - 1, (x, y) => {
    const dx = x - BCX, w = W(y); if (Math.abs(dx) > w) return null;
    const adx = Math.abs(dx);
    if (y >= 38 && adx >= SW - 14) { // sleeve cylinder
      if (adx === SW - 14) return suit[0];
      const u2 = clamp((adx - (SW - 7)) / 7, -1, 1);
      return pick(lambert(Math.sign(dx) * u2, 0, Math.sqrt(1 - u2 * u2)) - 0.03, suit, x, y);
    }
    const u = dx / w;
    let l = lambert(u * 0.9, 0, Math.sqrt(1 - u * u * 0.8)) + 0.05 * Math.sin(y * 0.6 + x * 0.2);
    return pick(l, suit, x, y);
  });
  // Shoulder rim light, left side.
  for (let y = 12; y < 40; y++) { const w = W(y); P.set(BCX - w, y, suit[5]); P.set(BCX - w + 1, y, suit[4]); }
  // Shirt V + collar.
  const apex = o.tie ? 50 : 58, vHalf = y => 10 * (1 - (y - 14) / (apex - 14));
  P.paint(0, 14, BW - 1, apex, (x, y) => { const dx = Math.abs(x - BCX); return dx <= vHalf(y) ? pick(lambert((x - BCX) / 14, 0.2, 0.9) - 0.05 + (y < 22 ? -0.15 : 0), shirt, x, y) : null; });
  // Lapels (lighter jacket) with a dark inner edge + highlight edge.
  P.paint(0, 14, BW - 1, apex + 4, (x, y) => {
    const dx = Math.abs(x - BCX), vh = vHalf(y), lw = 9 - (y - 14) * 0.1; if (dx <= vh || dx > vh + lw) return null;
    const s = Math.sign(x - BCX);
    if (dx <= vh + 1) return suit[0]; if (dx >= vh + lw - 0.5) return suit[5 - (s > 0 ? 2 : 0)];
    return pick(lambert(s * 0.4, -0.1, 0.9) + 0.18, suit, x, y);
  });
  for (const s of [-1, 1]) for (let x = 0; x < 6; x++) P.set(BCX + s * (vHalf(16) + 4 + x), 16 + Math.round(x * 0.6), suit[0]); // notch
  // Collar points.
  for (const s of [-1, 1]) for (let i = 0; i < 6; i++) for (let j = 0; j <= i / 2 + 1; j++) P.set(BCX + s * (9 - j + 1), 14 + i, shirt[i % 2 ? 5 : 4]);
  if (o.tie) {
    // Tie: knot, then body with diagonal stripes.
    const tie = ramp(o.tie, 6);
    P.paint(BCX - 4, 18, BCX + 4, 49, (x, y) => {
      const knot = y < 25, w = knot ? 3.5 : 2.2 + (y - 25) * 0.1 * (y < 44 ? 1 : -2.5), dx = x - BCX; if (Math.abs(dx) > w) return null;
      let c = pick(lambert(dx / w * 0.9, 0, 0.8) + (knot && y < 21 ? -0.1 : 0), tie, x, y);
      if (!knot && ((x + y) % 7 === 0)) c = hex('#e0b13a');
      return c;
    });
    P.set(BCX, 49, tie[0]);
  } else if (o.pendant) {
    for (let y = 16; y < 38; y++) { const v = vHalf(y); if (y % 2 === 0) { P.set(BCX - v + 1, y, hex('#e0b13a')); P.set(BCX + v - 1, y, hex('#e0b13a')); } }
    P.rect(BCX - 1, 40, 3, 3, hex('#e0b13a')); P.set(BCX, 41, hex('#c0392b')); P.set(BCX - 1, 40, hex('#fff3b0'));
  }
  // Lapel pin, jacket opening line + button.
  const pin = o.pin; if (pin) { P.rect(BCX - 21, 36, 4, 4, hex('#6d1a2a')); P.set(BCX - 21, 36, hex('#c0394e')); P.set(BCX - 20, 36, hex('#e0b13a')); }
  for (let y = apex + 4; y < BH; y++) P.set(BCX, y, suit[0]);
  for (const y of [apex + 10, apex + 24]) { P.rect(BCX + 3, y, 3, 3, suit[1]); P.set(BCX + 3, y, suit[5]); }
  // Fold wrinkles at the elbow area.
  for (const s of [-1, 1]) for (let i = 0; i < 5; i++) { P.set(BCX + s * (SW - 11 - i), 60 + i * 2, suit[1]); P.set(BCX + s * (SW - 9 - i), 70 + i * 2, suit[1]); }
  P.outline(dark);
  return P.canvas();
}

// ---------- hands ------------------------------------------------------------
function handPix(o, raised) {
  const skin = ramp(o.skin, 6), suit = ramp(o.suit, 6, [0.45, 0.4, 0.7]), cuff = ramp('#f2efe6', 6, [0.6, 0.6, 0.85], [255, 255, 245]);
  const skinOut = mix(hex(o.skin), [40, 18, 30], 0.78);
  if (!raised) { // resting: foreshortened sleeve, cuff, hand on the desk
    const P = new Pix(22, 22);
    P.paint(2, 0, 19, 9, (x, y) => { const u = (x - 10.5) / 8.5; return pick(lambert(u, 0, Math.sqrt(1 - Math.min(1, u * u))) - 0.05, suit, x, y); });
    P.rect(3, 9, 16, 2, cuff[5]); P.rect(3, 11, 16, 1, cuff[3]);
    P.paint(3, 12, 18, 21, (x, y) => { const u = (x - 10.5) / 7.5, v = (y - 15) / 4.4; const r = u * u + v * v; if (r > 1) return null; return pick(lambert(u, v, Math.sqrt(1 - r)) + 0.05, skin, x, y); });
    for (const x of [7, 10, 13]) for (let y = 17; y < 21; y++) P.set(x, y, skin[1]);
    P.outline(mix(hex(o.suit), [10, 8, 20], 0.7));
    return P.canvas();
  }
  const P = new Pix(30, 74); // raised: forearm upright, open palm, fingers + thumb
  P.paint(8, 36, 21, 73, (x, y) => { const u = (x - 14.5) / 6.5; return pick(lambert(u, 0, Math.sqrt(1 - Math.min(1, u * u))) - 0.04, suit, x, y); });
  P.rect(8, 33, 14, 3, cuff[5]); P.rect(8, 36, 14, 1, cuff[3]);
  P.paint(8, 20, 21, 33, (x, y) => { const u = (x - 14.5) / 6.5, v = (y - 27) / 7; const r = u * u + v * v * 0.5; if (r > 1) return null; return pick(lambert(u, v, Math.sqrt(1 - r)) + 0.05, skin, x, y); });
  for (const [fx, top] of [[8, 11], [11.5, 8], [15, 7], [18.5, 9]]) P.paint(fx, top, fx + 2, 23, (x, y) => { const u = (x - (fx + 1.2)) / 1.6; if (y < top + 1 && (x === fx || x === fx + 2)) return null; return pick(lambert(u, 0, 0.8) + 0.1, skin, x, y); });
  P.paint(2, 20, 9, 28, (x, y) => { const u = (x - 6) / 3.4, v = (y - 24) / 4.4; return u * u + v * v <= 1 && x + (y - 20) * 0.4 < 10 ? pick(lambert(u, v, 0.8) + 0.08, skin, x, y) : null; });
  P.outline(skinOut);
  return P.canvas();
}

// ---------- props --------------------------------------------------------------
function buildMug(label) {
  const P = new Pix(14, 14); const c = ramp('#f2efe6', 6, [0.6, 0.55, 0.85], [255, 255, 240]);
  P.paint(1, 1, 10, 12, (x, y) => { const u = (x - 5.5) / 5; return pick(lambert(u, 0, Math.sqrt(1 - u * u)) + 0.05, c, x, y); });
  for (let y = 4; y < 10; y++) { P.set(11, y, c[4]); P.set(12, y, c[3]); } P.set(11, 4, c[3]); P.set(11, 9, c[3]);
  P.set(5, 6, hex('#6d1a2a')); P.set(6, 6, hex('#6d1a2a')); P.set(4, 5, hex('#6d1a2a')); P.set(7, 5, hex('#6d1a2a')); P.set(4, 6, hex('#9b2d40')); P.set(7, 6, hex('#9b2d40')); P.set(5, 7, hex('#6d1a2a')); P.set(6, 7, hex('#6d1a2a'));
  P.outline([40, 24, 34]); return P.canvas();
}
function buildTablet() {
  const P = new Pix(40, 22); const bez = ramp('#2b3160', 6);
  P.paint(0, 0, 39, 21, (x, y) => (x < 1 || y < 1 || x > 37 || y > 20) ? bez[1] : null);
  P.paint(2, 2, 37, 19, (x, y) => pick(0.55 + (y < 8 ? 0.2 : 0) + 0.15 * Math.sin(x * 0.15), ramp('#3fa7d6', 6), x, y));
  for (let i = 0; i < 4; i++) P.rect(5, 5 + i * 3, 12 + (i * 7) % 14, 1, [240, 244, 250]);
  P.rect(24, 5, 11, 8, hex('#e0b13a')); P.outline([18, 12, 24]); return P.canvas();
}
function buildPapers() {
  const P = new Pix(34, 16); const c = ramp('#f2efe6', 6, [0.6, 0.6, 0.85], [255, 255, 245]);
  for (let k = 0; k < 3; k++) P.paint(k, 8 - k * 2, 30 + k, 14 - k * 2, (x, y) => pick(0.7 + k * 0.1 + (y % 3 === 0 ? -0.1 : 0), c, x, y));
  P.rect(5, 3, 12, 1, [120, 120, 140]); P.rect(5, 5, 18, 1, [120, 120, 140]);
  P.outline([40, 30, 40]); return P.canvas();
}

// ---------- desk ---------------------------------------------------------------
const DESK_Y = 186, DESK_H = 84;
function buildDesk(badgeImg) {
  const P = new Pix(GW, DESK_H);
  const top = ramp('#f2efe6', 6, [0.55, 0.55, 0.85], [255, 255, 248]), face = ramp('#6d1a2a', 6, [0.4, 0.3, 0.6], [255, 190, 170]);
  const gold = ramp('#e0b13a', 6, [0.45, 0.35, 0.5], [255, 250, 190]), navy = ramp('#1b1f3a', 6);
  const streaks = [64, 128, 192, 256, 320, 384];
  // Top surface: glossy, gradient from bright back edge, reflecting the ceiling lights.
  P.paint(0, 0, GW - 1, 19, (x, y) => {
    const t = y / 18, left = 40 - t * 10, right = 440 + t * 10; if (x < left || x > right) return null;
    let l = 0.92 - t * 0.36;
    for (const sx of streaks) { const d = Math.abs(x - (sx + (t * 6))) / 5; l += 0.14 * Math.max(0, 1 - d) * (1 - t * 0.4); }
    if (x < left + 2 || x > right - 2) l -= 0.3;
    return pick(l, top, x, y);
  });
  // Gold edge + shadow lip.
  P.paint(0, 18, GW - 1, 22, (x, y) => { const t = 1, left = 30, right = 450; if (x < left || x > right) return null; return y < 20 ? gold[y === 18 ? 5 : 4] : y < 21 ? gold[2] : gold[0]; });
  // Front: three bevelled panels with gradient, diagonal glass streaks.
  const panels = [[34, 156], [162, 318], [324, 446]];
  P.paint(0, 21, GW - 1, DESK_H - 1, (x, y) => {
    if (x < 30 || x > 450) return null;
    const yy = y - 21;
    if (yy > 56) return yy > 59 ? navy[1 + ((x >> 3) & 1) * 0] : navy[0];
    const inPanel = panels.find(([a, b]) => x >= a && x <= b);
    if (!inPanel) return face[0];
    const [a, b] = inPanel; let l = 0.62 - yy / 56 * 0.28;
    if (x === a || yy === 0) l += 0.18; if (x === b || yy >= 55) l -= 0.2;
    const diag = ((x - yy * 0.9) % 52 + 52) % 52; if (diag < 6 && yy > 3 && yy < 52) l += 0.14;
    return pick(l, face, x, y);
  });
  // Gold inlay line near the bottom of the panels.
  for (let x = 34; x <= 446; x++) if (!(x > 156 && x < 162) && !(x > 318 && x < 324)) P.set(x, 21 + 49, gold[3]);
  // Badge medallion in the centre panel.
  const bx = 240, by = 21 + 28;
  P.paint(bx - 24, by - 24, bx + 24, by + 24, (x, y) => { const r = Math.hypot(x - bx, y - by); return r <= 24 ? (r > 22 ? gold[4] : r > 21 ? gold[1] : navy[1]) : null; });
  if (badgeImg) { const c = document.createElement('canvas'); c.width = c.height = 36; const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(badgeImg, 0, 0, 36, 36); const d = g.getImageData(0, 0, 36, 36).data; for (let j = 0; j < 36; j++) for (let i = 0; i < 36; i++) { const k = (j * 36 + i) * 4; if (d[k + 3] > 140) P.set(bx - 18 + i, by - 18 + j, [Math.round(d[k] / 24) * 24, Math.round(d[k + 1] / 24) * 24, Math.round(d[k + 2] / 24) * 24]); } }
  P.outline([20, 10, 16]);
  return P.canvas();
}

// ---------- backdrop: existing studio art, downsampled + posterised with dither ----------
function bakeBackdrop(img) {
  const c = document.createElement('canvas'); c.width = GW; c.height = GH; const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, GW, GH);
  const id = g.getImageData(0, 0, GW, GH), d = id.data, L = 14;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { const i = (y * GW + x) * 4, b = BAYER[y & 3][x & 3] - 0.5; for (let k = 0; k < 3; k++) d[i + k] = clamp(Math.round((d[i + k] / 255 + b / L) * L) / L * 255, 0, 255) | 0; }
  g.putImageData(id, 0, 0); return c;
}

// ===== Build everything =====================================================
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const [studioImg, badgeImg] = await Promise.all([load('./public/spike/studio.jpg'), load('./public/badges/heart-of-midlothian.png')]);

const LOOK = {
  isla: { skin: '#e8b796', hair: '#8a4b2a', style: 'bob', suit: '#2b3160', lip: '#c4566a', iris: [[96, 120, 70], [140, 160, 96]], lashes: true, lash: [30, 16, 20], blush: true, pendant: true, pin: true, shoulder: 38, browThick: 1, browArch: 1.6 },
  fraser: { skin: '#f0c4a0', hair: '#b9b4ad', style: 'bald', suit: '#26262e', lip: '#b5675c', iris: [[70, 96, 130], [110, 140, 170]], dome: true, wrinkles: true, tie: '#9b2d3a', shoulder: 42, browThick: 2, browArch: 1.2 },
};
function bakePresenter(o) {
  const MOUTH = {
    closed: buildMouth(o, { hw: 6, open: 0, smile: 0.7 }), small: buildMouth(o, { hw: 5, open: 1.1 }), wide: buildMouth(o, { hw: 7, open: 1.4, teeth: true }),
    O: buildMouth(o, { hw: 3, open: 2.6, smile: -0.3 }), A: buildMouth(o, { hw: 6, open: 3.4, teeth: true, tongue: true }), E: buildMouth(o, { hw: 7, open: 1.8, teeth: true, smile: 0.4 }),
  };
  return {
    o, body: buildBody(o), head: buildHead(o), mouth: MOUTH,
    eyes: { open: [-1, 0, 1].map(g => buildEyes(o, 'open', g)), blink: buildEyes(o, 'blink', 0) },
    brows: [buildBrows(o, 0), buildBrows(o, 2)],
    hands: { rest: handPix(o, false), up: handPix(o, true) },
  };
}
const isla = bakePresenter(LOOK.isla), fraser = bakePresenter(LOOK.fraser);
const desk = buildDesk(badgeImg), backdrop = studioImg ? bakeBackdrop(studioImg) : null;
const mug = buildMug(), tablet = buildTablet(), papers = buildPapers();

// ===== Runtime =========================================================================
const cv = document.getElementById('cv'); cv.width = GW; cv.height = GH;
const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const LOOP = 13;
const SCRIPT = [
  { a: 0.4, b: 4.2, who: 'ISLA', by: 'isla', text: 'Good evening, and welcome to Hearts News 24.' },
  { a: 4.4, b: 8.8, who: 'ISLA', by: 'isla', text: 'Top story: Vrancken has the squad high-pressure proofed for Rangers.' },
  { a: 9.0, b: 12.6, who: 'FRASER', by: 'fraser', text: "Aye, Mato's a miss, but the belief's there." },
];
const POS = { isla: { x: 150, y: 104 }, fraser: { x: 330, y: 102 } };
const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const easeOut = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const VIS = ['closed', 'small', 'wide', 'O', 'A', 'E', 'small', 'A', 'wide', 'small'];
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

function drawPresenter(p, who, t, cur) {
  const pos = POS[who], talking = cur && cur.by === who;
  const breath = Math.round(Math.sin(t * 1.9 + (who === 'isla' ? 0 : 2)) * 0.5 + 0.5);
  const emphasis = talking && Math.sin(t * 2.3) > 0.4;
  const nod = !talking && Math.sin(t * 1.1 + 1) > 0.93 ? 1 : 0;
  const bob = (talking ? Math.round(Math.sin(t * 5) * 0.5 + 0.5) : 0) + nod;
  const bodyX = pos.x - BCX, bodyY = pos.y + 17 + breath;     // neck top sits under the chin
  const headX = pos.x - HCX + (talking ? Math.round(Math.sin(t * 1.3) * 1) : 0), headY = pos.y - HCY + bob + breath * 0 + 0;
  // Raised hand (behind desk, over the body).
  const gesture = talking && Math.sin(t * 1.7 + 0.5) > 0.2;
  g.drawImage(p.body, bodyX, bodyY);
  if (gesture) g.drawImage(p.hands.up, pos.x + p.o.shoulder - 24, DESK_Y - 72 + 2);
  // Head + features.
  g.drawImage(p.head, headX, headY);
  const blink = ((t + (who === 'isla' ? 0 : 1.5)) % 3.4) > 3.28;
  const gaze = talking ? 0 : (who === 'isla' ? 1 : -1);
  g.drawImage(blink ? p.eyes.blink : p.eyes.open[gaze + 1], headX + HCX - 20, headY + HCY + FACE.eyeY - 7);
  g.drawImage(p.brows[emphasis ? 1 : 0], headX + HCX - 20, headY + HCY + FACE.browY - 6 + 1);
  const key = talking ? VIS[Math.floor(t * 11 + hash(Math.floor(t * 11))) % VIS.length] : 'closed';
  g.drawImage(p.mouth[key], headX + HCX - 14, headY + HCY + FACE.mouthY - 8);
}

const STACK = 48;   // art px taken by the bottom stack; the scene is lifted by this much so the desk front stays clear
const TICKER = [['HT', 'HEARTS 2-1 DUNDEE UTD'], ['RESULT', 'MOTHERWELL 0-2 HIBERNIAN'], ['NEXT', 'HEARTS V RANGERS, SATURDAY 12:30'], ['NEWS', 'MATO RULED OUT WITH HAMSTRING'], ['TABLE', 'HEARTS THIRD, TWO POINTS CLEAR OF HIBS'], ['NEWS', 'VRANCKEN: "THE BELIEF IS THERE"']];
const track = document.getElementById('track'), clock = document.getElementById('clock'), frame = document.getElementById('frame'), headin = document.getElementById('headin');
const itemsHtml = TICKER.map(([k, v]) => `<span><b>${k}</b>${v}</span>`).join('');
track.innerHTML = `<div style="display:flex">${itemsHtml}</div><div style="display:flex">${itemsHtml}</div>`;
const who = document.getElementById('who'), line = document.getElementById('line'), cap = document.getElementById('cap');

function tick(ms) {
  const t = (ms / 1000) % LOOP, cur = SCRIPT.find(s => t >= s.a && t < s.b);
  g.save(); g.translate(0, -STACK);
  if (backdrop) g.drawImage(backdrop, 0, 0); else { g.fillStyle = '#1b1f3a'; g.fillRect(0, 0, GW, GH); }
  drawPresenter(isla, 'isla', t, cur); drawPresenter(fraser, 'fraser', t, cur);
  g.drawImage(desk, 0, DESK_Y);
  // Props and resting hands on the desk top.
  g.drawImage(mug, 70, DESK_Y + 1); g.drawImage(mug, 398, DESK_Y + 1);
  for (const [sx, ph] of [[75, 0], [403, 1.7]]) for (let i = 0; i < 3; i++) { const yy = DESK_Y - 3 - ((t * 9 + i * 5 + ph * 4) % 14), a = 1 - ((t * 9 + i * 5 + ph * 4) % 14) / 14; g.fillStyle = `rgba(240,240,255,${0.5 * a})`; g.fillRect(sx + Math.round(Math.sin(yy * 0.6 + ph) * 1.4), yy, 1, 2); }
  g.drawImage(tablet, 196, DESK_Y + 5); g.drawImage(papers, 262, DESK_Y + 4);
  g.drawImage(isla.hands.rest, 112, DESK_Y + 2); g.drawImage(fraser.hands.rest, 350, DESK_Y + 2);
  if (!(cur && cur.by === 'isla' && Math.sin(t * 1.7 + 0.5) > 0.2)) g.drawImage(isla.hands.rest, 160, DESK_Y + 2);
  g.drawImage(fraser.hands.rest, 300, DESK_Y + 2);
  g.restore();

  const bk = easeOut(seg(t, 4.8, 5.6)), out = easeOut(seg(t, 12.2, 12.8));
  headin.style.clipPath = `inset(0 ${(1 - bk + out) * 100}% 0 0)`;
  // Ticker scrolls 30 art px/s in whole-art-pixel steps; clock is real time.
  const u = frame.clientWidth / GW, w1 = track.firstChild.offsetWidth / u;
  track.style.transform = `translateX(${-Math.floor((ms / 1000 * 30) % w1) * u}px)`;
  const d = new Date(); clock.textContent = String(d.getHours()).padStart(2, '0') + (d.getSeconds() % 2 ? ' ' : ':') + String(d.getMinutes()).padStart(2, '0');
  cap.style.visibility = cur ? 'visible' : 'hidden';
  if (cur) { who.textContent = cur.who; line.textContent = cur.text.slice(0, Math.floor(seg(t, cur.a + 0.1, cur.b - 0.5) * cur.text.length) + 1); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
