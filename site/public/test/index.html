<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hearts News 24 — standing Isla and Fraser test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
<style>
  html, body { margin: 0; height: 100%; background: #0e0c10; overflow: hidden; font-family: 'Press Start 2P', monospace; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; aspect-ratio: 16 / 9; width: min(100vw, 100vh * 16 / 9); font-size: calc(min(100vw, 100vh * 16 / 9) / 100); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #start { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #e0b13a; color: #3d0d17; border: 0; padding: 1em 1.4em; font: inherit; font-size: 1.3em; cursor: pointer; }
  #cap { position: absolute; left: 3em; right: 3em; bottom: 2em; background: #120f22; color: #f2efe6; padding: .6em 1.2em; font-size: .95em; line-height: 1.6; visibility: hidden; }
  #cap b { color: #e0b13a; font-weight: normal; margin-right: .8em; }
  #hint { position: fixed; right: 12px; top: 10px; color: #f2efe6aa; font: 12px sans-serif; }
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="cv"></canvas>
  <button id="start">CLICK TO START (SOUND ON)</button>
  <div id="cap"><b id="who"></b><span id="line"></span></div>
</div></div>
<div id="hint">standing Isla · 1 palm · 2 idle · 3 point · 4 open · 5 explain · 6 tablet · 7 hip · 8 left · 9 welcome · 0 auto · M mouth test · B blink · G glance · T timed/loud lips · R replay line</div>
<script type="module">
const { loadPresenter } = await import('./presenter-player.js');
const GW = 480, GH = 270;
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });

// ---- backdrop: the generated studio on its 480-column grid ----
function backdropFromGrid(img) {
  const BB = 1376 / 480, c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const sg = c.getContext('2d', { willReadFrequently: true }); sg.drawImage(img, 0, 0);
  const d = sg.getImageData(0, 0, c.width, c.height).data, rows = Math.floor(c.height / BB);
  const out = document.createElement('canvas'); out.width = GW; out.height = GH; const og = out.getContext('2d'), id = og.createImageData(GW, GH);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const j = Math.min(rows - 1, Math.max(0, y - Math.floor((GH - rows) / 2)));
    const sx = Math.min(c.width - 1, Math.round((x + 0.5) * BB)), sy = Math.min(c.height - 1, Math.round((j + 0.5) * BB)), k = (sy * c.width + sx) * 4, o = (y * GW + x) * 4;
    id.data[o] = d[k]; id.data[o + 1] = d[k + 1]; id.data[o + 2] = d[k + 2]; id.data[o + 3] = 255;
  }
  og.putImageData(id, 0, 0); return out;
}
const bgImg = await load('../spike/studio-pixel.jpg');
const backdrop = bgImg ? backdropFromGrid(bgImg) : null;

// ---- standing presenters: baked sprite sheets from tools/bake, stacked by presenter-player.js ----
const [ISLA, FRA] = await Promise.all([loadPresenter('../presenters/isla'), loadPresenter('../presenters/fraser')]);
const POSES = { palm: 'palm', idle: 'b1', point: 'b2', open: 'b3', explain: 'b4', tablet: 'b5', hip: 'b6', left: 'b7', welcome: 'b8' };
const POSE_NAMES = Object.keys(POSES), MOUTHS = ['rest', 'closed', 'small', 'wide', 'O', 'A', 'press', 'smile'];
let headNow = 'b1', feetNow = 'b1';
const frame = (eye, mouth, pose = 'idle') => ISLA.frame({ head: headNow, pose: POSES[pose] || 'b1', feet: feetNow, eye, mouth });
const DERIVED = false;
const fraserFrame = (head, pose, feet, eye, mouth) => FRA.frame({ head, pose, feet, eye, mouth });
const FXF = -10, FYF = 40;   // Fraser stands to the left of Isla
// ---- audio: the same Kokoro lines as the broadcast spike, level drives the mouth ----
const ACX = new (window.AudioContext || window.webkitAudioContext)();
const analyser = ACX.createAnalyser(); analyser.fftSize = 512; analyser.connect(ACX.destination);
const spec = new Uint8Array(analyser.fftSize);
const SCRIPT = await (await fetch('../spike/audio/lines.json')).json();
await Promise.all(SCRIPT.map(s => new Promise(res => {
  s.el = new Audio('../spike/audio/' + s.file); s.el.preload = 'auto';
  ACX.createMediaElementSource(s.el).connect(analyser);
  s.el.addEventListener('loadedmetadata', res); s.el.addEventListener('error', res);
})));
// Timed mouth shapes (#75): Rhubarb's cues from tools/lipsync, one file per clip. A clip without one falls back to loudness.
await Promise.all(SCRIPT.map(async s => { try { s.cues = (await (await fetch('../spike/audio/' + s.file.replace(/\.\w+$/, '.mouth.json'))).json()).cues; } catch { s.cues = null; } }));
// Rhubarb's shapes on to the presenters' mouths: A lips together (M B P), B slightly open, C open (EH), D wide open (AA), E rounded (AO), F puckered (OO W), G F and V, H L, X silence.
const RHUBARB = { A: 'press', B: 'small', C: 'wide', D: 'A', E: 'O', F: 'O', G: 'small', H: 'wide', X: 'closed' };
/** The shape at `sec` into the clip: each cue holds until the next one starts. */
const cueAt = (cues, sec) => { let v = 'X'; for (const [at, c] of cues) { if (at > sec) break; v = c; } return RHUBARB[v] || 'closed'; };
let mouthMode = new URLSearchParams(location.search).get('mouth') === 'loud' ? 'loud' : 'timed';
let started = false, idx = -1, cur = null, LEVEL = 0, mTest = -1;
const who = document.getElementById('who'), line = document.getElementById('line'), cap = document.getElementById('cap');
function next() {
  idx = (idx + 1) % SCRIPT.length; cur = SCRIPT[idx]; cur.t0 = performance.now(); cur.el.currentTime = 0; cur.el.play().catch(() => {});
  cur.el.onended = () => { cur = null; gap = setTimeout(next, 450); };
}
let gap = 0;
/** Play the current (or just finished) line again, to compare the two mouth modes on the same words. */
function replay() { clearTimeout(gap); if (cur) { cur.el.onended = null; cur.el.pause(); } idx = (idx - 1 + SCRIPT.length) % SCRIPT.length; next(); }
document.getElementById('start').onclick = e => { ACX.resume(); e.target.remove(); started = true; next(); };

// ---- runtime ----
const cv = document.getElementById('cv'); cv.width = GW; cv.height = GH;
const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const VIS = ['small', 'wide', 'O', 'A', 'closed', 'small', 'A', 'wide', 'smile'];
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
let forceBlink = 0, forceGlance = 0, env = 0, shape = 'closed', shapeAt = 0, forcedPose = new URLSearchParams(location.search).get('pose') || '';
const GESTURES = ['palm', 'point', 'open', 'explain', 'welcome'], POSE_ACTIVE = new Set(GESTURES), TO_SCREEN = new Set(['point', 'palm', 'open']);
let feetAt = 0, lastTalk = 0, wasTalking = false, poseTarget = 'idle', poseAt = 0, quietFor = 0, glanceUntil = 0, lastMs = 0, gi = 0;
/** Pick the next gesture (never the same twice), blink on the cut, and look at the screen if the gesture points at it. */
function nextGesture(ms) {
  let n; do { n = GESTURES[Math.floor(hash(ms * 0.001 + gi++) * GESTURES.length)]; } while (n === poseTarget);
  poseTarget = n; poseAt = ms; forceBlink = ms + 150; if (TO_SCREEN.has(n)) glanceUntil = ms + 1300;
  const pool = ['b1', 'h2', 'h3', 'h4', 'h5', 'b1']; headNow = TO_SCREEN.has(n) ? 'h1' : pool[Math.floor(hash(ms * 0.003 + gi) * pool.length)];   // pointing turns her head to the screen (h1 is right)
  if (ms - feetAt > 7000) { const fp = ['b1', 'f1', 'f2', 'f3', 'b1']; feetNow = fp[Math.floor(hash(ms * 0.007 + gi) * fp.length)]; feetAt = ms; }
}
addEventListener('keydown', e => { if (e.key === '0') forcedPose = ''; else if (/^[1-9]$/.test(e.key)) forcedPose = POSE_NAMES[+e.key - 1] || ''; });
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 'm') mTest = (mTest + 1) % MOUTHS.length; else if (k === 'b') forceBlink = performance.now() + 160; else if (k === 'g') forceGlance = performance.now() + 900; else if (k === 'escape') mTest = -1; else if (k === 't') mouthMode = mouthMode === 'timed' ? 'loud' : 'timed'; else if (k === 'r' && started) replay(); });
const FX = 128, FY = 40;   // where the figure's top-left sits on the 480x270 canvas (feet end near the bottom)
const SCREEN = { x: 262, y: 60, w: 190, h: 110 };

// ---- motion: arm changes trail the head by 150 ms, and the upper body breathes 1 px ----
const STAGGER = 150;   // ms the arms wait behind the head
/** Arm motion for one presenter. `compose(pose, ...rest)` draws a frame; the head is already in `rest`, so it changes at once while the arms hold the old pose for STAGGER ms, then cut to the new one. */
function armMotion(compose) {
  let shown = null, from = null, to = null, at = 0;
  return (ms, want, ...rest) => {
    if (shown === null) shown = want;
    if (to !== null && (ms >= at || want !== to)) { shown = to; to = null; }
    if (to === null && want !== shown) { from = shown; to = want; at = ms + STAGGER; }
    return compose(to !== null ? from : shown, ...rest);
  };
}
/** Draws a sprite at (x, y). With `up`, everything above row `cut` sits 1 px higher and the legs stay put; the hem row is doubled to close the gap. */
function drawBody(c, x, y, cut, up) {
  if (!up) { g.drawImage(c, x, y); return; }
  g.drawImage(c, 0, 0, c.width, cut, x, y - 1, c.width, cut);
  g.drawImage(c, 0, cut - 1, c.width, 1, x, y + cut - 1, c.width, 1);
  g.drawImage(c, 0, cut, c.width, c.height - cut, x, y + cut, c.width, c.height - cut);
}
const islaArms = armMotion((pose, eye, key) => frame(eye, key, pose));
const fraserArms = armMotion((pose, head, feet, eye, mouthKey) => fraserFrame(head, pose, feet, eye, mouthKey));

function tick(ms) {
  const dt = Math.min(100, ms - (lastMs || ms)); lastMs = ms;
  const t = ms / 1000, talking = !!cur && cur.by === 'a';
  const breathing = Math.sin(t * 1.85) > 0.6;   // idle breath: upper body 1 px higher for about 30% of each 3.4 s cycle
  analyser.getByteTimeDomainData(spec); { let mx = 0; for (const v of spec) mx = Math.max(mx, Math.abs(v - 128)); LEVEL = mx / 128; }
  g.fillStyle = '#1b1f3a'; g.fillRect(0, 0, GW, GH);
  if (backdrop) g.drawImage(backdrop, 0, 0);
  // Screen to point at: bezel, panel, placeholder content.
  g.fillStyle = '#0e0c10'; g.fillRect(SCREEN.x - 3, SCREEN.y - 3, SCREEN.w + 6, SCREEN.h + 6);
  g.fillStyle = '#6d1a2a'; g.fillRect(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h);
  g.fillStyle = '#e0b13a'; g.fillRect(SCREEN.x, SCREEN.y, SCREEN.w, 4);
  g.fillStyle = '#f2efe6'; g.font = '8px "Press Start 2P", monospace'; g.fillText('HEARTS 2-1 DUNDEE UTD', SCREEN.x + 10, SCREEN.y + 26);
  g.fillStyle = '#e0b13a'; g.fillText('FULL TIME', SCREEN.x + 10, SCREEN.y + 44);
  // Eye state: periodic blink, occasional glance at the screen while talking.
  const blinking = (t % 3.6) > 3.48 || ms < forceBlink;
  const glance = ms < forceGlance || ms < glanceUntil ? 1 : talking && (t % 6.7) > 6.0 ? 1 : 0;
  const eye = blinking ? 'blink' : glance ? 'gazeR' : 'open';
  // Mouth: level-driven visemes while talking, a smile now and then at rest. M cycles through every shape for inspection.
  // Mouth: follow a smoothed loudness envelope (fast attack, slow release) and hold each shape for a moment so it does not flicker.
  env += (LEVEL > env ? 0.5 : 0.12) * (LEVEL - env);
  const talkingF = !!cur && cur.by === 'b';
  const timed = mouthMode === 'timed' && cur?.cues;
  if ((talking || talkingF) && timed) shape = cueAt(cur.cues, cur.el.currentTime);
  else if ((talking || talkingF) && ms - shapeAt > 85) { const want = env < 0.04 ? 'closed' : env < 0.11 ? 'small' : env < 0.2 ? (hash(Math.floor(t * 4)) > 0.5 ? 'wide' : 'O') : 'A'; if (want !== shape) { shape = want; shapeAt = ms; } }
  const key = mTest >= 0 ? MOUTHS[mTest] : talking ? shape : (t % 5 < 1.2 ? 'smile' : 'rest');
  // Pose: while she talks, cut to a new gesture every few seconds; while Fraser talks she listens (idle or hand on hip). 1-9 force a pose, 0 goes back to automatic.
  // Gestures change on phrase starts (a pause, then speech), not on a timer, with a blink and a look at the screen on the cut.
  if (env < 0.04) quietFor += dt; else { if (quietFor > 220 && talking && !forcedPose && ms - poseAt > 2000) nextGesture(ms); quietFor = 0; }
  if (!talking && !forcedPose && ms - poseAt > 5200) { poseTarget = poseTarget === 'idle' ? (hash(ms) > 0.45 ? 'hip' : 'idle') : 'idle'; poseAt = ms; }   // listening: drift between the two resting poses
  if (talking) lastTalk = ms;
  if (talking && !wasTalking && !forcedPose && ms - poseAt > 600) nextGesture(ms);                                                                   // her line has just started: gesture straight away
  wasTalking = talking;
  if (!talking && POSE_ACTIVE.has(poseTarget) && !forcedPose && ms - lastTalk > 900) { poseTarget = 'idle'; poseAt = ms; }                                   // she finished speaking: hold the gesture a moment, then lower her arms

  const want = forcedPose || (DERIVED ? 'palm' : poseTarget);
  drawBody(islaArms(ms, want, eye, key), FX, FY, 119, breathing);
  // Fraser: drifts between head and weight poses on a slow timer, blinks on his own beat, mouth follows the loudness while he speaks.
  { const hp = ['b1', 'h3', 'b1', 'h5', 'b1', 'h4', 'h6', 'h2', 'b1'], fp = ['b1', 'b1', 'f1', 'b1', 'f3', 'b1', 'f2', 'b1'], gp = ['b2', 'b3', 'b4', 'b8', 'b3'];
    const fpose = talkingF ? gp[Math.floor(hash(Math.floor(t / 3.1) * 2.9) * gp.length)] : (Math.floor(t / 6) % 3 === 0 ? 'b6' : 'b1');
    const fh = fpose === 'b2' || fpose === 'b3' ? 'h1' : hp[Math.floor(hash(Math.floor(t / 2.6) * 1.7) * hp.length)];   // pointing or palm out: head turns to the screen
    const ff = fp[Math.floor(hash(Math.floor(t / 7) * 3.3) * fp.length)];
    const fe = ((t + 1.3) % 4.2) > 4.08 ? 'blink' : 'open', fm = talkingF ? shape : (t % 9 < 1 ? 'smile' : 'rest');
    drawBody(fraserArms(ms, fpose, fh, ff, fe, fm === 'closed' ? 'closed' : fm), FXF, FYF, 138, breathing); }
  cap.style.visibility = cur ? 'visible' : 'hidden';
  if (cur) { who.textContent = cur.by === 'b' ? 'FRASER' : 'ISLA'; const p = Math.min(1, (performance.now() - cur.t0) / 1000 / ((cur.el.duration || 4) + 0.1)); line.textContent = cur.text.slice(0, Math.floor(p * cur.text.length) + 1); }
  if (mTest >= 0) { g.fillStyle = '#e0b13a'; g.fillText('MOUTH: ' + MOUTHS[mTest], 8, 14); }
  else { g.fillStyle = '#e0b13a'; g.fillText('LIPS: ' + (mouthMode === 'loud' ? 'LOUD' : cur && !cur.cues ? 'LOUD (NO CUES)' : 'TIMED'), 8, 14); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
