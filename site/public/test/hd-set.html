<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hearts News 24 - baked HD set test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0c10; overflow: hidden; font: 13px system-ui, sans-serif; color: #f2efe6; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; aspect-ratio: 16 / 9; width: min(100vw, 100vh * 16 / 9); overflow: hidden; background: #120f22; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; transform-origin: 0 0; }
  #hud { position: fixed; left: 12px; top: 10px; line-height: 1.6; background: #0e0c10cc; padding: 6px 10px; border-radius: 4px; }
  #hud b { color: #e0b13a; font-weight: 600; }
</style>
</head>
<body>
<div id="stage"><div id="frame"><canvas id="cv"></canvas></div></div>
<div id="hud"></div>
<script type="module">
// The HD studio set drawn only from the baked files in ../hd (#81): backdrop.png, desk.png, props.png and set.json. No grid sampling here.
// Seated Isla and Fraser come from the baked sheets (presenter-player.js); the desk is drawn over them.
// Keys: 1 wide, 2 Isla close, 3 Fraser close, 4 both / 5 Isla / 6 Fraser at the desk, 7 / 8 cycle Isla's / Fraser's prop, H cycles heads, M cycles mouths, B blinks.
// URL: ?cam=wide|isla|fraser  &desk=both|isla|fraser  &isla=none|laptop|mug|...  &fraser=...  &head=b1  &lift=0 (no stack lift)
const { loadPresenter } = await import('./presenter-player.js');
const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const SET = await fetch('../hd/set.json').then(r => r.json());
const [backdrop, desk, propSheet, ISLA, FRASER] = await Promise.all([load('../hd/' + SET.backdrop.file), load('../hd/' + SET.desk.file), load('../hd/' + SET.props.file), loadPresenter('../' + SET.seated.presenters.isla), loadPresenter('../' + SET.seated.presenters.fraser)]);
const GW = SET.w, GH = SET.h, PRES = { isla: ISLA, fraser: FRASER };
const cv = document.getElementById('cv'); cv.width = GW; cv.height = GH;
const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const qs = new URLSearchParams(location.search);
let cam = qs.get('cam') ?? 'wide', seated = qs.get('desk') ?? 'both';
const slot = { isla: qs.get('isla') ?? SET.props.default.isla, fraser: qs.get('fraser') ?? SET.props.default.fraser };
const lift = qs.get('lift') === '0' ? 0 : SET.stack;
const HEADS = ISLA.heads, MOUTHS = ['rest', ...ISLA.mouths], PROP_NAMES = ['none', ...Object.keys(SET.props.items)];
const st = { head: Math.max(0, HEADS.indexOf(qs.get('head') ?? 'b1')), mouth: 0, blink: 0 };
const isTight = () => cam !== 'wide' && (seated === 'both' || seated === cam);
const seatX = who => seated !== 'both' ? SET.seated.seats.alone : isTight() ? SET.seated.seats.tight[who] : SET.seated.seats.wide[who];
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ('123'.includes(k) && k) cam = ['wide', 'isla', 'fraser'][k - 1]; else if ('456'.includes(k) && k) seated = ['both', 'isla', 'fraser'][k - 4];
  else if (k === '7' || k === '8') { const w = k === '7' ? 'isla' : 'fraser'; slot[w] = PROP_NAMES[(PROP_NAMES.indexOf(slot[w]) + 1) % PROP_NAMES.length]; }
  else if (k === 'h') st.head = (st.head + 1) % HEADS.length; else if (k === 'm') st.mouth = (st.mouth + 1) % MOUTHS.length; else if (k === 'b') st.blink = performance.now() + 160;
});
function drawProp(name, cx, k) {
  const p = SET.props.items[name]; if (!p) return;
  const kk = name === 'laptop' && k > 1 ? k * SET.props.laptopTight : k;
  const [sx, sy, sw, sh] = p.sheet, w = Math.round(sw * p.s * kk), h = Math.round(sh * p.s * kk), x = Math.round(cx - w / 2);
  const y = SET.props.base + Math.round((k - 1) * 26) - (k > 1 && p.side ? 4 : 0) - h - (name === 'laptop' ? SET.props.laptopLift : 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.drawImage(propSheet, sx, sy, sw, sh, x, y, w, h); g.imageSmoothingEnabled = false;
}
function tick(ms) {
  const tight = isTight(), z = tight ? SET.camera.tight.z : 1, sh = tight ? { ...SET.camera.tight, x: seatX(cam) } : SET.camera.wide;
  cv.style.transform = `translate(${((240 - z * sh.x) / GW * 100).toFixed(3)}%, ${((sh.sy - z * sh.y) / GH * 100).toFixed(3)}%) scale(${z})`;
  g.fillStyle = '#0e0c10'; g.fillRect(0, 0, GW, GH);
  g.save(); g.translate(0, -lift);
  g.drawImage(backdrop, SET.backdrop.x, SET.backdrop.y);
  const o = { head: HEADS[st.head], pose: 'b1', eye: ms < st.blink ? 'blink' : 'open', mouth: MOUTHS[st.mouth] };
  for (const who of ['isla', 'fraser']) if (seated === 'both' || seated === who) g.drawImage(PRES[who].frame(o), seatX(who) - 120, SET.desk.top - SET.seated.hcut);
  g.drawImage(desk, SET.desk.x, SET.desk.y);
  for (const who of ['isla', 'fraser']) if (slot[who] !== 'none' && (seated === 'both' || seated === who)) {
    const big = tight && cam === who, side = SET.props.items[slot[who]].side;
    drawProp(slot[who], seatX(who) + (side * SET.props.slotSide * (big ? 2 : 1) + SET.seated.propx * (big ? 1.3 : 1)) * (who === 'isla' ? 1 : -1), big ? SET.props.tightScale : 1);
  }
  g.restore();
  document.getElementById('hud').innerHTML = `<b>cam</b> ${cam} <b>desk</b> ${seated} <b>head</b> ${o.head} (H) <b>mouth</b> ${o.mouth} (M) blink (B) &nbsp; 1-3 camera, 4-6 desk, 7/8 props`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
