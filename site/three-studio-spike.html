<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hearts News 24 — 3D pixel studio spike</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
<style>
  html, body { margin: 0; height: 100%; background: #0e0c10; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; aspect-ratio: 16 / 9; width: min(100vw, 100vh * 16 / 9); overflow: hidden; font-family: 'Press Start 2P', 'Courier New', monospace; font-size: calc(min(100vw, 100vh * 16 / 9) / 100); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  /* Chunky stepped borders = pixel look without images. */
  .px { box-shadow: 0 -.3em 0 0 #0e0c10, 0 .3em 0 0 #0e0c10, -.3em 0 0 0 #0e0c10, .3em 0 0 0 #0e0c10; }
  #tag { position: absolute; left: 5em; bottom: 11.4em; background: #e0b13a; color: #3d0d17; padding: .9em 1.2em; font-size: 1.5em; transform: translateX(-130%); }
  #bar { position: absolute; left: 5em; right: 5em; bottom: 5.4em; background: #6d1a2a; color: #f2efe6; padding: 1em 1.4em; font-size: 1.25em; line-height: 1.6; border-left: .8em solid #e0b13a; clip-path: inset(0 100% 0 0); }
  #cap { position: absolute; left: 5em; right: 5em; bottom: 1.4em; background: #120f22; color: #f2efe6; padding: .9em 1.4em; font-size: 1.15em; line-height: 1.7; }
  #cap b { color: #e0b13a; font-weight: normal; margin-right: .8em; }
  #hint { position: fixed; right: 12px; top: 10px; color: #f2efe6aa; font: 12px sans-serif; }
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <div id="tag" class="px">TOP STORY</div>
  <div id="bar" class="px">VRANCKEN HAS HEARTS HIGH-PRESSURE PROOFED FOR RANGERS</div>
  <div id="cap" class="px"><b id="who"></b><span id="line"></span></div>
</div></div>
<div id="hint">3D pixel studio spike · 13s loop</div>

<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Everything renders at a tiny native resolution and is scaled up with nearest-neighbour,
// then colour-quantised with an ordered dither, so 3D geometry still reads as pixel art.
const RW = 480, RH = 270;
const NAVY = 0x120f22, MAROON = 0x6d1a2a, GOLD = 0xe0b13a, CREAM = 0xf2efe6;

const frame = document.getElementById('frame');
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(RW, RH, false);
frame.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0a14);
const camera = new THREE.PerspectiveCamera(28, RW / RH, 0.1, 60);

scene.add(new THREE.AmbientLight(0x8a8fc0, 0.9));
const key = new THREE.DirectionalLight(0xfff0dc, 2.2); key.position.set(-3, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xc2304a, 1.1); rim.position.set(4, 3, -3); scene.add(rim);

const OUTLINE = new THREE.LineBasicMaterial({ color: 0x0e0c10, transparent: true, opacity: 0.85 });
function box(w, h, d, color, { outline = true, basic = false, parent } = {}) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, basic ? new THREE.MeshBasicMaterial({ color }) : new THREE.MeshLambertMaterial({ color }));
  if (outline) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), OUTLINE));
  if (parent) parent.add(m);
  return m;
}
const nearest = t => { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; return t; };

// ---- Studio ----------------------------------------------------------------
const studio = new THREE.Group(); scene.add(studio);

// Pixel-art video wall texture (3×3 panels with diagonal glare), drawn once on a tiny canvas.
const wallCanvas = document.createElement('canvas'); wallCanvas.width = 192; wallCanvas.height = 108;
const wg = wallCanvas.getContext('2d'); wg.imageSmoothingEnabled = false;
const wallTex = nearest(new THREE.CanvasTexture(wallCanvas));
const badge = new Image(); badge.src = './public/badges/heart-of-midlothian.png';
const face = new Image(); face.src = './public/faces/wouter-vrancken.png';
function drawWall(t, topStory) {
  wg.fillStyle = '#0e0c10'; wg.fillRect(0, 0, 192, 108);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
    const x = 2 + i * 63, y = 2 + j * 35, w = 61, h = 33;
    wg.fillStyle = '#3d0d17'; wg.fillRect(x, y, w, h);
    wg.fillStyle = '#6d1a2a'; wg.fillRect(x, y + 6, w, h - 12);
    wg.fillStyle = '#9b2d40'; for (let k = -h; k < w; k += 14) for (let q = 0; q < h; q++) { const px = k + q; if (px >= 0 && px < w - 1 && (q % 2 === 0)) wg.fillRect(x + px, y + q, 2, 1); }
    wg.fillStyle = '#c05468'; wg.fillRect(x, y, w, 1); wg.fillRect(x, y + h - 1, w, 1); wg.fillRect(x, y, 1, h); wg.fillRect(x + w - 1, y, 1, h);
  }
  // centre panel content
  const cx = 2 + 63, cy = 2 + 35;
  wg.fillStyle = '#1b1f3a'; wg.fillRect(cx + 1, cy + 1, 59, 31);
  if (!topStory) {
    if (badge.complete) wg.drawImage(badge, cx + 20, cy + 3, 21, 21);
    wg.fillStyle = '#e0b13a'; wg.fillRect(cx + 8, cy + 26, 45, 3);
    wg.fillStyle = (Math.floor(t * 2) % 2) ? '#c0392b' : '#7d231b'; wg.fillRect(cx + 4, cy + 4, 8, 4);
  } else {
    if (face.complete) wg.drawImage(face, cx + 3, cy + 3, 27, 27);
    wg.fillStyle = '#e0b13a'; wg.fillRect(cx + 34, cy + 5, 22, 5);
    wg.fillStyle = '#f2efe6'; wg.fillRect(cx + 34, cy + 14, 22, 2); wg.fillRect(cx + 34, cy + 19, 18, 2); wg.fillRect(cx + 34, cy + 24, 20, 2);
  }
  wallTex.needsUpdate = true;
}
const wall = new THREE.Mesh(new THREE.PlaneGeometry(4.8, 2.7), new THREE.MeshBasicMaterial({ map: wallTex }));
wall.position.set(0, 2.0, -4); studio.add(wall);
const wallFrame = box(4.95, 2.85, 0.1, 0x0e0c10, { outline: false }); wallFrame.position.set(0, 2.0, -4.07); studio.add(wallFrame);

const backWall = box(14, 4.4, 0.2, 0x1b1f3a, { outline: false }); backWall.position.set(0, 2.2, -4.2); studio.add(backWall);
// Gold light strip + ceiling spot discs.
const strip = box(9.6, 0.16, 0.3, GOLD, { basic: true, outline: false }); strip.position.set(0, 3.62, -3.95); studio.add(strip);
for (let i = 0; i < 7; i++) { const d = box(0.28, 0.04, 0.28, 0xfff3c8, { basic: true, outline: false }); d.position.set(-3.6 + i * 1.2, 3.52, -3.85); studio.add(d); }
// Side towers: cream light pillar + navy tower with blue LED strips (parallax as the camera sways).
for (const s of [-1, 1]) {
  const tower = box(1.1, 4.4, 1.1, 0x1b1f3a); tower.position.set(s * 5.1, 2.2, -3.0); studio.add(tower);
  const tower2 = box(0.8, 4.4, 0.8, 0x2b3160); tower2.position.set(s * 4.35, 2.2, -3.5); studio.add(tower2);
  const pillar = box(0.18, 2.8, 0.12, CREAM, { basic: true, outline: false }); pillar.position.set(s * 3.7, 1.9, -3.9); studio.add(pillar);
  for (const y of [1.0, 2.9]) { const led = box(0.55, 0.05, 0.02, 0x3fa7d6, { basic: true, outline: false }); led.position.set(s * 4.35, y, -3.09); studio.add(led); }
}
// Glossy floor.
const mirror = new Reflector(new THREE.PlaneGeometry(16, 12), { textureWidth: 240, textureHeight: 135, color: 0x555a78, clipBias: 0.003 });
mirror.rotation.x = -Math.PI / 2; mirror.position.set(0, 0, -2); studio.add(mirror);
const sheen = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), new THREE.MeshBasicMaterial({ color: 0x120f22, transparent: true, opacity: 0.72 }));
sheen.rotation.x = -Math.PI / 2; sheen.position.set(0, 0.004, -2); studio.add(sheen);

// Desk: maroon front with gold trim and badge, cream top.
const desk = new THREE.Group(); desk.position.set(0, 0, 0.85); desk.scale.y = 0.68; studio.add(desk);
const dTop = box(3.9, 0.07, 0.95, 0xf2efe6); dTop.position.y = 0.72; desk.add(dTop);
const dFront = box(3.9, 0.68, 0.14, MAROON); dFront.position.set(0, 0.35, 0.4); desk.add(dFront);
const dTrim = box(3.92, 0.06, 0.16, GOLD); dTrim.position.set(0, 0.66, 0.4); desk.add(dTrim);
const dBase = box(3.9, 0.03, 0.9, 0x3d0d17); dBase.position.set(0, 0.015, 0.0); desk.add(dBase);
const badgeTex = nearest(new THREE.TextureLoader().load('./public/badges/heart-of-midlothian.png'));
const dBadge = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.42), new THREE.MeshBasicMaterial({ map: badgeTex, transparent: true }));
dBadge.position.set(0, 0.33, 0.475); desk.add(dBadge);
// Props: two mugs and a tablet.
const mug = (x) => { const m = box(0.1, 0.12, 0.1, CREAM); m.position.set(x, 0.81, -0.05); desk.add(m); };
mug(-1.55); mug(1.55);
const tablet = box(0.3, 0.02, 0.22, 0x1b1f3a); tablet.position.set(0.0, 0.77, 0.12); tablet.rotation.y = 0.2; desk.add(tablet);

// ---- Presenters ------------------------------------------------------------
function makePresenter(look) {
  const g = new THREE.Group();
  const torso = box(0.62, 0.74, 0.34, look.suit); torso.position.y = 0.37; g.add(torso);
  const shirt = box(0.2, 0.5, 0.02, look.shirt, { outline: false }); shirt.position.set(0, 0.46, 0.175); g.add(shirt);
  for (const s of [-1, 1]) { const lap = box(0.14, 0.52, 0.03, look.suit, { outline: true }); lap.position.set(s * 0.17, 0.46, 0.185); lap.rotation.z = s * -0.22; g.add(lap); }
  if (look.tie) { const tie = box(0.06, 0.38, 0.03, look.tie, { outline: false }); tie.position.set(0, 0.44, 0.2); g.add(tie); }
  const neck = box(0.16, 0.1, 0.16, look.skin); neck.position.y = 0.78; g.add(neck);

  const head = new THREE.Group(); head.position.y = 0.82; g.add(head);
  const skull = box(0.4, 0.44, 0.38, look.skin); skull.position.y = 0.22; head.add(skull);
  const nose = box(0.06, 0.08, 0.05, look.skin === '#f0c4a0' ? 0xd9a07c : 0xcf9a78, { outline: false }); nose.position.set(0, 0.2, 0.21); head.add(nose);
  const eyes = [];
  for (const s of [-1, 1]) {
    const e = box(0.06, 0.07, 0.02, 0x0e0c10, { outline: false }); e.position.set(s * 0.1, 0.27, 0.195); head.add(e); eyes.push(e);
    const hl = box(0.02, 0.02, 0.01, 0xffffff, { outline: false, basic: true }); hl.position.set(s * 0.1 + 0.012, 0.29, 0.206); head.add(hl);
    const brow = box(0.1, 0.025, 0.02, look.hair, { outline: false }); brow.position.set(s * 0.1, 0.34, 0.195); head.add(brow);
  }
  const mouth = box(0.13, 0.03, 0.02, 0x5a1f2a, { outline: false }); mouth.position.set(0, 0.1, 0.195); head.add(mouth);
  const hairMat = look.hair;
  if (look.hairStyle === 'bob') {
    const top = box(0.44, 0.12, 0.42, hairMat); top.position.set(0, 0.46, 0); head.add(top);
    const back = box(0.44, 0.5, 0.12, hairMat); back.position.set(0, 0.2, -0.2); head.add(back);
    for (const s of [-1, 1]) { const side = box(0.07, 0.38, 0.34, hairMat); side.position.set(s * 0.235, 0.2, -0.02); head.add(side); }
    const fringe = box(0.4, 0.09, 0.05, hairMat); fringe.position.set(0, 0.41, 0.2); head.add(fringe);
  } else { // bald with grey sides
    for (const s of [-1, 1]) { const side = box(0.05, 0.16, 0.26, hairMat); side.position.set(s * 0.215, 0.18, -0.02); head.add(side); }
    const back = box(0.34, 0.14, 0.05, hairMat); back.position.set(0, 0.14, -0.2); head.add(back);
  }

  const arms = [];
  for (const s of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(s * 0.37, 0.7, 0.02); g.add(sh);
    const up = box(0.15, 0.5, 0.15, look.suit); up.position.y = -0.25; sh.add(up);
    const hand = box(0.11, 0.09, 0.11, look.skin); hand.position.y = -0.55; sh.add(hand);
    sh.rotation.x = -1.35; arms.push(sh);
  }
  return { g, head, mouth, eyes, arms };
}
const isla = makePresenter({ skin: 0xe8b796, hair: 0x8a4b2a, hairStyle: 'bob', suit: 0x2b3160, shirt: 0xf2efe6 });
const fraser = makePresenter({ skin: 0xf0c4a0, hair: 0xb9b4ad, hairStyle: 'bald', suit: 0x26262e, shirt: 0xf2efe6, tie: 0x6d1a2a });
isla.g.position.set(-0.85, 0.06, 0.65); isla.g.rotation.y = 0.18;
fraser.g.position.set(0.85, 0.06, 0.65); fraser.g.rotation.y = -0.18;
scene.add(isla.g, fraser.g);

// ---- Post: tone-map then ordered-dither colour quantise --------------------
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(RW, RH);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, levels: { value: 7.0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float levels; varying vec2 vUv;
    float bayer(vec2 p){ int x = int(mod(p.x,4.0)); int y = int(mod(p.y,4.0));
      int i = x + y*4; float m[16] = float[16](0.,8.,2.,10., 12.,4.,14.,6., 3.,11.,1.,9., 15.,7.,13.,5.); return m[i]/16.0 - 0.5; }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      c += bayer(gl_FragCoord.xy) / levels * 0.9;
      c = floor(c * levels + 0.5) / levels;
      vec2 d = vUv - 0.5; c *= 1.0 - dot(d,d) * 0.9;
      gl_FragColor = vec4(c, 1.0);
    }`,
}));

// ---- Script ----------------------------------------------------------------
const LOOP = 13;
const SCRIPT = [
  { a: 0, b: 4.2, who: 'ISLA', by: isla, text: 'Good evening, and welcome to Hearts News 24.' },
  { a: 4.2, b: 8.8, who: 'ISLA', by: isla, text: 'Top story: Vrancken has the squad high-pressure proofed for Rangers.' },
  { a: 8.8, b: 12.6, who: 'FRASER', by: fraser, text: "Aye, Mato's a miss, but the belief's there." },
];
const easeOut = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const tag = document.getElementById('tag'), bar = document.getElementById('bar');
const who = document.getElementById('who'), line = document.getElementById('line'), cap = document.getElementById('cap');

function tick(ms) {
  const t = (ms / 1000) % LOOP;
  const cur = SCRIPT.find(s => t >= s.a && t < s.b);

  // Camera: slow push-in and side sway so the 3D reads.
  const k = seg(t, 0, LOOP);
  camera.position.set(Math.sin(t * 0.35) * 0.55, 1.3 + Math.sin(t * 0.5) * 0.04, 7.4 - k * 0.5);
  camera.lookAt(0, 1.0, 0);

  for (const p of [isla, fraser]) {
    const talking = cur && cur.by === p;
    // Mouth flap via layered sines, blink every ~3s, head bob and a hand gesture while talking.
    const open = talking ? Math.max(0, Math.sin(t * 17) * Math.sin(t * 6.3 + 1)) : 0;
    p.mouth.scale.y = 0.6 + open * 3.2; p.mouth.scale.x = 1 - open * 0.25;
    const blink = ((t + (p === isla ? 0 : 1.4)) % 3.1) > 3.0 ? 0.1 : 1;
    p.eyes.forEach(e => e.scale.y = blink);
    p.head.rotation.y = (p === isla ? -0.12 : 0.12) * (talking ? 0.4 : 1) + Math.sin(t * 0.9) * 0.04;
    p.head.rotation.x = talking ? Math.sin(t * 3) * 0.04 : 0.03;
    p.g.position.y = 0.06 + Math.sin(t * 1.6 + (p === isla ? 0 : 2)) * 0.008;
    const lift = talking ? (0.25 + 0.25 * Math.sin(t * 2.2)) : 0;
    p.arms[1].rotation.x = -1.35 - lift * 0.8; p.arms[1].rotation.z = -lift * 0.35;
    p.arms[0].rotation.x = -1.35;
  }

  drawWall(t, t > 4.2 && t < 12.8);

  // Overlays
  const tk = easeOut(seg(t, 4.4, 4.9)); tag.style.transform = `translateX(${(1 - tk) * -130}%)`;
  const bk = easeOut(seg(t, 4.7, 5.5)); const out = easeOut(seg(t, 12.2, 12.8));
  bar.style.clipPath = `inset(0 ${(1 - bk + out) * 100}% 0 0)`;
  if (out > 0) tag.style.transform = `translateX(${out * -130}%)`;
  cap.style.visibility = cur ? 'visible' : 'hidden';
  if (cur) { who.textContent = cur.who; line.textContent = cur.text.slice(0, Math.floor(seg(t, cur.a + 0.1, cur.b - 0.6) * cur.text.length) + 1); }

  composer.render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
