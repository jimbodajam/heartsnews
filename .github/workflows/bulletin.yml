# Builds a job from the channel's queue and publishes it to the gh-pages branch, which GitHub Pages serves. The
# Worker's clock (worker/src/clock.ts) queues a job for each programme and breaking package that's due, and runs this
# workflow with the job's id when the home PC isn't there to take it (`npm run agent`). The job is claimed in the store
# first, so if the PC got there after all, this run does nothing. The same code as on the PC (pipeline/src/jobs.ts),
# with Kokoro voices on the CPU. A manual run with no job makes a programme now.
# Each programme reads and writes the channel's memory in the D1 store (pipeline/src/store.ts), so the channel moves on.

name: Bulletin
run-name: ${{ inputs.job || 'Programme (manual run)' }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: A job id from the queue (the Worker sends it). Leave blank to make a programme now.
        required: false
        default: ''
      kind:
        description: programme or breaking
        required: false
        default: programme

permissions:
  contents: write

# No concurrency group: each run claims its own job in the store, and publishing takes turns through a lock there.
# (A group would cancel a queued run, and with it a goal.)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Kokoro voice model (~330MB) downloads on first use; keep it between runs.
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-${{ hashFiles('package-lock.json') }}

      # A ready-built ffmpeg (for MP3 clips), downloaded once and kept between runs. apt-get once stalled breaking
      # news for 11 minutes. If the download fails, the clips come out as WAV instead.
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-linux64-gpl

      - name: Install ffmpeg
        run: |
          if [ ! -x ~/ffmpeg/ffmpeg ]; then
            rm -rf /tmp/ffmpeg && mkdir -p /tmp/ffmpeg
            if curl -fsSL --max-time 120 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
                | tar -xJ -C /tmp/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' && /tmp/ffmpeg/ffmpeg -version > /dev/null; then
              rm -rf ~/ffmpeg && mv /tmp/ffmpeg ~/ffmpeg
            else
              echo "::warning::Couldn't download ffmpeg: clips will be WAV"
            fi
          fi
          if [ -x ~/ffmpeg/ffmpeg ]; then echo "$HOME/ffmpeg" >> "$GITHUB_PATH"; fi

      # Forum data collected at home by `npm run snapshot`, for sources that block GitHub's servers.
      - name: Fetch home snapshots
        if: inputs.kind != 'breaking'
        run: |
          mkdir -p snapshots
          if git fetch --depth=1 origin snapshots; then git archive FETCH_HEAD | tar -x -C snapshots; ls -l snapshots; else echo "No snapshots branch yet"; fi

      - name: Run the job
        env:
          JOB: ${{ inputs.job }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: if [ -n "$JOB" ]; then npm run job -- --id "$JOB"; else npm run job; fi
