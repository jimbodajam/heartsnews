# Builds a fresh bulletin (collect → script → voices) and publishes the player to GitHub Pages.
# Runs every hour, on every push to main, and on demand from the Actions tab. Each build starts from the
# previous one's memory.json (read back from the live site), so the channel moves on to new stories.

name: Bulletin

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One bulletin at a time; a newer run replaces a queued one.
concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Kokoro voice model (~330MB) downloads on first use; keep it between runs.
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-${{ hashFiles('package-lock.json') }}

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)

      # Forum data collected at home by `npm run snapshot`, for sources that block GitHub's servers.
      - name: Fetch home snapshots
        run: |
          mkdir -p snapshots
          if git fetch --depth=1 origin snapshots; then git archive FETCH_HEAD | tar -x -C snapshots; ls -l snapshots; else echo "No snapshots branch yet"; fi

      - name: Build bulletin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run bulletin

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
