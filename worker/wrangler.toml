name = "heartsnews-live"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# The channel's clock (src/clock.ts): every minute, queue what's due and hand it out.
[triggers]
crons = ["* * * * *"]

[vars]
# Whose bulletin workflow builds the jobs the home PC doesn't take. The token is a secret:
# `npx wrangler secret put GITHUB_DISPATCH_TOKEN` (fine-grained, this repo only, Actions: read and write).
# The club's team-news graphic (issue #40) is read through Instagram's Graph API: `npx wrangler secret put IG_USER_ID` and
# `npx wrangler secret put IG_ACCESS_TOKEN` (long-lived, about 60 days). Without them BBC's sheet is the team news.
GITHUB_REPO = "jimbodajam/heartsnews"

# The channel's memory (src/store.ts). Create it once with `npx wrangler d1 create heartsnews` and paste its id here.
[[d1_databases]]
binding = "DB"
database_name = "heartsnews"
database_id = "9600a5c8-b2a6-47d4-bab1-c38a5d392249"
migrations_dir = "migrations"
