# Keeps the agent log from growing for ever (issue #101). Needs sudo once, on the Mac:
#   sudo install -m 644 -o root -g wheel ~/heartsnews/tools/mac/newsyslog-heartsnews.conf /etc/newsyslog.d/heartsnews.conf
# Rotates at 5 MB and keeps 5 gzipped copies. No signal is sent (N): run-agent.sh reopens the log for every line.
# logfilename                                     owner:group  mode count size when flags
/Users/server/Library/Logs/heartsnews-agent.log   server:staff 644  5     5120 *    JN
